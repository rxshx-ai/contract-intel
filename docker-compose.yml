# Local Postgres for development. The app falls back to SQLite when
# DATABASE_URL is unset, so this is optional -- run it when you want to
# exercise the same engine you deploy on.
#
#   docker compose up -d
#   export DATABASE_URL=postgresql://postgres:postgres@localhost:5433/contract_intel
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: contract_intel
    ports: ["5433:5432"]          # 5433 to avoid clashing with a local install
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
